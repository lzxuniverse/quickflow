$kind: http-request
name: 'properties_list'
order: 1000
method: POST
url: '{{base_url}}/api/mcp'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 10,
      "method": "tools/call",
      "params": {
        "name": "properties_list",
        "arguments": {
          "search": "",
          "status": "active",
          "page": 1,
          "per_page": 10
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("JSON-RPC 2.0", () => pm.expect(res.jsonrpc).to.eql("2.0"));
      pm.test("No error", () => pm.expect(res).to.not.have.property("error"));
      pm.test("Result has content", () => pm.expect(res.result.content).to.be.an("array"));
      const data = JSON.parse(res.result.content[0].text);
      pm.test("Response has properties array", () => pm.expect(data).to.have.property("properties"));
      pm.test("Response has total count", () => pm.expect(data).to.have.property("total"));
      if (data.properties.length > 0) {
        pm.collectionVariables.set("property_id", data.properties[0].uuid);
      }
