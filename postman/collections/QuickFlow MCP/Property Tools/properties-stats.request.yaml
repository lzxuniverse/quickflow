$kind: http-request
name: 'properties_stats'
order: 6000
method: POST
url: '{{base_url}}/api/mcp'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 15,
      "method": "tools/call",
      "params": {
        "name": "properties_stats",
        "arguments": {
          "tenant_id": "{{tenant_id}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("JSON-RPC 2.0", () => pm.expect(res.jsonrpc).to.eql("2.0"));
      pm.test("No error", () => pm.expect(res).to.not.have.property("error"));
      pm.test("Result has content", () => pm.expect(res.result.content).to.be.an("array"));
      const data = JSON.parse(res.result.content[0].text);
      pm.test("Stats has total_properties", () => pm.expect(data).to.have.property("total_properties"));
      pm.test("Stats has active_properties", () => pm.expect(data).to.have.property("active_properties"));
      pm.test("Stats has total_rooms", () => pm.expect(data).to.have.property("total_rooms"));
      pm.test("Stats has average_rating", () => pm.expect(data).to.have.property("average_rating"));
